[project]
name = "sanyojan"
version = "0.1.0"
description = "Sanyojan — From intent to action. Safe, read-only browser workflows."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.3",
  "pydantic==2.11.7",
  "pydantic-settings==2.9.1",
  "playwright==1.56.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
